<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRA SOUL Admin</title><style>
*{box-sizing:border-box}body{font:16px system-ui;background:#f4f1eb;color:#222;margin:0;padding:24px}main{max-width:1100px;margin:auto}h1{margin:0 0 6px}.muted{color:#777}.panel{background:#fff;border-radius:14px;padding:22px;margin:18px 0;box-shadow:0 4px 20px #0001}.login{max-width:420px;margin:10vh auto}input,select,button{padding:12px;border:1px solid #ccc;border-radius:8px;font:inherit}button{cursor:pointer;background:#252525;color:white;border:0}button.secondary{background:#eee;color:#222}form{display:flex;gap:10px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;border-bottom:1px solid #eee;padding:10px;vertical-align:top}th{background:#f8f8f8}.table-wrap{overflow:auto}.stat{font-size:26px;font-weight:700}.error{color:#b22}.actions{display:flex;gap:8px;align-items:center}@media(max-width:600px){body{padding:12px}.panel{padding:14px}}
</style></head><body><main><h1>IRA SOUL Admin</h1><p class="muted">Enquiry management dashboard</p>
<section id="login" class="panel login"><h2>Admin login</h2><form id="login-form"><input id="password" type="password" placeholder="Admin password" required style="flex:1;min-width:180px"><button>Login</button></form><p id="login-error" class="error"></p></section>
<section id="dashboard" hidden><div class="panel"><div class="stat" id="total">0</div><div class="muted">Total enquiries</div><p><button class="secondary" id="refresh">Refresh</button> <button id="logout">Logout</button></p></div><div class="panel"><h2>Enquiries</h2><div class="table-wrap"><table><thead><tr><th>Name / Phone</th><th>Occasion</th><th>Activity</th><th>Budget</th><th>Date</th><th>Message</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></section>
</main><script>
const $=s=>document.querySelector(s), login=$('#login'),dash=$('#dashboard');
async function api(path,opts={}){const r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});if(!r.ok)throw Error((await r.json().catch(()=>({error:r.statusText}))).error||r.statusText);return r.json();}
function showDash(){login.hidden=true;dash.hidden=false;load();}
function showLogin(){login.hidden=false;dash.hidden=true;}
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();$('#login-error').textContent='';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});showDash()}catch(err){$('#login-error').textContent=err.message}});
async function load(){try{const {requests}=await api('/api/admin/requests');$('#total').textContent=requests.length;$('#rows').innerHTML='';requests.forEach(r=>{const tr=document.createElement('tr');const vals=[r.name+'\n'+r.phone,r.occasion||'—',r.activity||'—',r.budget||'—',r.date||'—',r.message||'—'];vals.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});const status=document.createElement('td');const select=document.createElement('select');['Pending','Contacted','Completed'].forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;o.selected=r.status===s;select.appendChild(o)});select.addEventListener('change',async()=>{try{await api('/api/admin/requests/'+r.id,{method:'PATCH',body:JSON.stringify({status:select.value})})}catch(e){alert(e.message);load()}});status.appendChild(select);tr.appendChild(status);const action=document.createElement('td'),del=document.createElement('button');del.textContent='Delete';del.className='secondary';del.addEventListener('click',async()=>{if(confirm('Delete this enquiry?')){await api('/api/admin/requests/'+r.id,{method:'DELETE'});load()}});action.appendChild(del);tr.appendChild(action);$('#rows').appendChild(tr);});}catch(e){if(e.message==='Unauthorized'){showLogin()}else alert(e.message)}}
$('#refresh').onclick=load;$('#logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});showLogin()};showLogin();
</script></body></html>
